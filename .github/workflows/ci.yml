name: Smart Museum CI — Lint, Security, Unit, Integration & AI Benchmark

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability audit (high/critical gate)
        run: npm audit --audit-level=high

      - name: Static syntax check across all JS modules
        run: npm run lint

      - name: Run Unit Tests
        run: npm run test:unit

      - name: Run Security Tests (CORS, Fail-Closed Auth, RBAC, Rate-Limit, Magic-Byte)
        run: npm run test:security

      - name: Run Integration Tests (End-to-End HTTP, BLE Multi-Device, Auto-Learning 2.0)
        run: npm run test:integration

      - name: Run 800-Case Multilingual Hold-Out AI Benchmark Gate
        run: npm run benchmark:ai
        env:
          GROQ_API_KEY: ""
